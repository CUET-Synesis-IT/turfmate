name: Backend CI

on:
  push:
    branches: ["main", "master", "develop", "s/frontend"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main", "master", "develop"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-backend:
    name: Validate Backend & Schemas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compilation Check
        run: |
          python -m compileall app

      - name: Verify App & Database Models Initialization
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          SECRET_KEY: ci-secret-key-for-testing-only-12345
          BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          python -c "import app.models; from app.main import app; print('✓ FastAPI App and SQLModel models successfully initialized')"
